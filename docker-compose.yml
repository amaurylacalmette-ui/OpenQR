services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openqr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openqr}
      POSTGRES_DB: ${POSTGRES_DB:-openqr}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-openqr} -d $${POSTGRES_DB:-openqr}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # The app connects to the "db" service inside the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-openqr}:${POSTGRES_PASSWORD:-openqr}@db:5432/${POSTGRES_DB:-openqr}?schema=public
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      IP_HASH_SALT: ${IP_HASH_SALT:?Set IP_HASH_SALT to a long random string in .env}
      OPENQR_AUTOMIGRATE: ${OPENQR_AUTOMIGRATE:-true}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
